syntax = "proto3";
package artcraft.v1;
option go_package = "github.com/A4GOD-AMHG/CubaLinked-ArtCraftModule/proto/artcraft/v1;artcraftv1";

import "google/protobuf/timestamp.proto";
import "core/v1/core.proto";
import "retail/v1/retail.proto";
import "orders/v1/orders.proto";

// ArtCraftService serves artisans: works with options, materials and cost, custom orders and the
// production board.
service ArtCraftService {
  // CreateWork adds a handmade work with its options, occasions and lead days.
  rpc CreateWork(UpsertWorkRequest) returns (Work);
  // UpdateWork changes a work; work_id is required.
  rpc UpdateWork(UpsertWorkRequest) returns (Work);
  // DeleteWork removes a work; managers only.
  rpc DeleteWork(WorkIDRequest) returns (core.v1.MessageResponse);
  // GetWork returns a public work with its options and materials.
  rpc GetWork(WorkIDRequest) returns (Work);
  // ListWorks returns the public catalog of works.
  rpc ListWorks(ListWorksRequest) returns (ListWorksResponse);
  // SetWorkMaterials sets the retail supplies and quantities one unit of a work consumes; managers
  // only.
  rpc SetWorkMaterials(SetWorkMaterialsRequest) returns (Work);
  // EstimateWorkCost prices a work's materials at current retail costs plus labor, for pricing
  // decisions.
  rpc EstimateWorkCost(EstimateWorkCostRequest) returns (CostEstimate);

  // RequestCustomOrder places a custom order for a catalog work or a free idea with reference
  // photos, options, quantity, needed-by date and delivery. Works that are not made to order must be
  // bought from the catalog, and the date must respect the work's lead days. It publishes
  // artcraft.custom_order_requested.
  rpc RequestCustomOrder(RequestCustomOrderRequest) returns (CustomOrder);
  // GetCustomOrder returns a custom order with its specification.
  rpc GetCustomOrder(OrderRefRequest) returns (CustomOrder);
  // ConsumeOrderMaterials deducts the work's materials from retail stock once per order and moves
  // the order into progress. Free-idea orders must deduct their materials from inventory directly.
  rpc ConsumeOrderMaterials(OrderRefRequest) returns (CustomOrder);
  // ListProductionBoard groups open custom orders by status for the coming days, flagging late ones.
  rpc ListProductionBoard(ListProductionBoardRequest) returns (ProductionBoard);

  // GetPublicProfile returns the public page data of an artisan by id or slug, with works for sale.
  rpc GetPublicProfile(GetPublicProfileRequest) returns (PublicProfile);
}

enum CraftCategory {
  CRAFT_CATEGORY_UNSPECIFIED = 0; ETERNAL_FLOWERS = 1; GIFTS = 2; DECOR = 3; JEWELRY = 4; CERAMICS = 5; TEXTILES = 6; WOOD = 7; PAINTING = 8;
  PARTY = 9; PERSONALIZED = 10; OTHER_CRAFT = 11;
}

message OptionChoice { string value = 1; core.v1.Money extra_price = 2; }
message WorkOption { string key = 1; string label = 2; repeated OptionChoice choices = 3; bool required = 4; bool free_text = 5; }
message MaterialLine { string product_id = 1; string name = 2; double quantity = 3; string unit = 4; core.v1.Money unit_cost = 5; }

message Work {
  string id = 1; string business_id = 2; string title = 3; string description = 4; repeated core.v1.Image images = 5; CraftCategory category = 6;
  repeated string techniques = 7; repeated string occasions = 8; bool made_to_order = 9; core.v1.Money base_price = 10; int32 production_days = 11;
  double labor_hours = 12; repeated WorkOption options = 13; string retail_product_id = 14; repeated MaterialLine materials = 15; bool is_active = 16;
  int32 sort_order = 17; google.protobuf.Timestamp created_at = 18;
}
message UpsertWorkRequest {
  string business_id = 1; string work_id = 2; string title = 3; string description = 4; repeated string image_file_ids = 5; CraftCategory category = 6;
  repeated string techniques = 7; repeated string occasions = 8; bool made_to_order = 9; core.v1.Money base_price = 10; int32 production_days = 11;
  double labor_hours = 12; repeated WorkOption options = 13; string retail_product_id = 14; bool is_active = 15; int32 sort_order = 16;
}
message WorkIDRequest { string business_id = 1; string work_id = 2; }
message ListWorksRequest { string business_id = 1; CraftCategory category = 2; string occasion = 3; bool made_to_order_only = 4; bool include_inactive = 5; int32 page = 6; int32 page_size = 7; }
message ListWorksResponse { repeated Work works = 1; int32 total = 2; }
message SetWorkMaterialsRequest { string business_id = 1; string work_id = 2; repeated MaterialLine materials = 3; }

message EstimateWorkCostRequest { string business_id = 1; string work_id = 2; int32 quantity = 3; core.v1.Money hourly_rate = 4; int32 margin_percent = 5; }
message CostEstimate {
  core.v1.Money materials = 1; core.v1.Money labor = 2; core.v1.Money total_cost = 3; core.v1.Money suggested_price = 4; double margin_percent_at_base = 5;
  repeated MaterialLine lines = 6; repeated string missing_stock = 7;
}

message ChosenOption { string key = 1; string value = 2; }
message RequestCustomOrderRequest {
  string business_id = 1; string work_id = 2; repeated ChosenOption options = 3; int32 quantity = 4; repeated string reference_image_file_ids = 5;
  google.protobuf.Timestamp needed_by = 6; bool delivery = 7; string delivery_address = 8; string gift_message = 9; string notes = 10;
  string customer_name = 11; string customer_phone = 12; string title = 13;
}
message CustomOrder {
  orders.v1.Order order = 1; string work_id = 2; string work_title = 3; repeated ChosenOption options = 4; int32 quantity = 5; core.v1.Money estimated_price = 6;
  bool delivery = 7; string delivery_address = 8; string gift_message = 9; bool materials_consumed = 10; bool late = 11;
}
message OrderRefRequest { string business_id = 1; string order_id = 2; }
message ListProductionBoardRequest { string business_id = 1; int32 days_ahead = 2; }
message ProductionColumn { orders.v1.OrderStatus status = 1; repeated CustomOrder orders = 2; }
message ProductionBoard { repeated ProductionColumn columns = 1; int32 late = 2; int32 due_this_week = 3; }

message GetPublicProfileRequest { string slug = 1; string business_id = 2; }
message PublicProfile { core.v1.Business business = 1; repeated Work works = 2; repeated retail.v1.Product products = 3; repeated string occasions = 4; }
